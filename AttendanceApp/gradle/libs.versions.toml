[versions]
kotlin                = "2.0.21"
agp                   = "8.7.0"
composeBom            = "2024.04.01"
hilt                  = "2.51"
room                  = "2.6.1"
supabase              = "2.5.3"
ktor                  = "2.3.12"
datastore             = "1.1.1"
lifecycle             = "2.8.3"
navigation            = "2.7.7"
workmanager           = "2.9.1"
playServicesLocation  = "21.3.0"
coroutines            = "1.8.1"

[libraries]
compose-bom               = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui                = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling        = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3         = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose          = { group = "androidx.activity", name = "activity-compose", version = "1.9.0" }
nav-compose               = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
hilt-android              = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler             = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-nav-compose          = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }
room-runtime              = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                  = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler             = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
supabase-postgrest        = { group = "io.github.jan-tennermann", name = "postgrest-kt", version.ref = "supabase" }
supabase-realtime         = { group = "io.github.jan-tennermann", name = "realtime-kt", version.ref = "supabase" }
ktor-android              = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
datastore-prefs           = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
work-runtime              = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
hilt-work                 = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }
hilt-work-compiler        = { group = "androidx.hilt", name = "hilt-compiler", version = "1.2.0" }
play-location             = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
coroutines-android        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.7.1" }
junit                     = { group = "junit", name = "junit", version = "4.13.2" }
androidx-test-ext-junit   = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
espresso-core             = { group = "androidx.test.espresso", name = "espresso-core", version = "3.6.1" }
compose-ui-test-junit4    = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[plugins]
android-application       = { id = "com.android.application", version.ref = "agp" }
kotlin-android            = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose            = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                      = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                       = { id = "com.google.devtools.ksp", version = "2.0.21-1.0.28" }
kotlin-serialization      = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
